name: flutter_start_pack
description: "Flutter 개발 시작시, 필요한 파일을 가지고 시작하는 스타트 팩"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 상태관리 (리버팟)
  flutter_riverpod: ^2.6.1

  # 라우팅
  go_router: ^17.5.0

  # api 통신 패키지
  dio: ^5.11.1
  retrofit: ^4.10.0
  pretty_dio_logger: ^1.4.0     # API 통신 Logger

  # 코드 자동 생성 패키지 (JsonSerializable)
  json_annotation: ^4.12.0

  # 데이터 저장 패키지
  flutter_secure_storage: ^11.2.0

  # UI 관련 패키지
  flutter_svg: ^2.3.4
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

  # TODO: 소셜 로그인 실제 연동 시 추가 (각 SDK 별 네이티브 설정 필요)
  # google_sign_in:
  # sign_in_with_apple:
  # kakao_flutter_sdk_user:
  # flutter_naver_login:

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # 코드 생성기 : dart run build_runner build
  build_runner: ^2.15.1
  retrofit_generator: ^10.3.3
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true

  assets:
    - asset/svg/logo/
